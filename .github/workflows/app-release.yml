name: App release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      - name: Build proot jniLibs
        run: ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" runtime/build-proot.sh

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured." \
              "A release must not be debug-signed: Android cannot upgrade across a" \
              "signature change, so every installed device would have to uninstall" \
              "and lose its runner registration and stored credentials."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # versionName/versionCode are derived from this, so an update always
          # outranks what it replaces.
          DROIDRUNNER_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: ./gradlew testDebugUnitTest assembleRelease

      # GPL-2.0 §3 is satisfied by offering the source from the same place as
      # the binary, and a release is such a place. Built before publishing so a
      # failure here stops the release rather than producing an APK with no
      # source beside it (issue #116).
      - name: Build the corresponding source archive
        run: |
          tag='${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}'
          runtime/build-source-archive.sh "$tag"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}'
          cp app/build/outputs/apk/release/app-release.apk "droidrunner-$tag.apk"
          gh release create "$tag" --title "DroidRunner $tag" --generate-notes || true
          gh release upload "$tag" --clobber \
            "droidrunner-$tag.apk" \
            "runtime/out/droidrunner-$tag-source.tar.gz"
