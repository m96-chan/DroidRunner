name: App release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # First, before the checkout and long before the keystore is anywhere
      # near this runner. Everything below derives a version, a file name and
      # a GitHub release from this one string, and `git check-ref-format`
      # permits `'`, `;`, `$` and a backtick inside it (#203).
      #
      # Three numbers exactly, because that is what the build can read: an
      # `-rc1` suffix does not match the regex in app/build.gradle.kts, so
      # versionName falls back to 0.0.0-dev and versionCode to 1. A release
      # built that way installs as a development build and can never be
      # upgraded from.
      - name: Check the tag is the shape a release can carry
        id: release_tag
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # The tag goes on its own line rather than into the ::error::,
            # which is a line-oriented command a dispatched input could
            # otherwise write more of.
            echo "::error::Refusing to release: the tag is not v<major>.<minor>.<patch>."
            printf 'tag was: %s\n' "$TAG"
            exit 1
          fi
          echo "releasing $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          # A manual dispatch has a branch of its own. The tag input chooses
          # both the source and the version, even when that branch is main.
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}

      - name: Verify the checkout matches the release tag
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          tag_commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          head_commit="$(git rev-parse --verify HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error::The checkout does not match the release tag."
            exit 1
          fi
          echo "building $TAG from $head_commit"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      - name: Build proot jniLibs
        run: ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" runtime/build-proot.sh

      - name: Decode signing keystore
        # For pipefail: a keystore that does not decode must stop the release
        # rather than leave a truncated .jks for Gradle to fail on later.
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured." \
              "A release must not be debug-signed: Android cannot upgrade across a" \
              "signature change, so every installed device would have to uninstall" \
              "and lose its runner registration and stored credentials."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # versionName/versionCode are derived from this, so an update always
          # outranks what it replaces.
          DROIDRUNNER_RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: ./gradlew testDebugUnitTest assembleRelease

      # GPL-2.0 §3 is satisfied by offering the source from the same place as
      # the binary, and a release is such a place. Built before publishing so a
      # failure here stops the release rather than producing an APK with no
      # source beside it (issue #116).
      - name: Build the corresponding source archive
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: runtime/build-source-archive.sh "$TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "droidrunner-$TAG.apk"
          # A published version is immutable. Refuse an existing release and
          # a missing remote tag; neither may be replaced by a dispatch (#252).
          gh release create "$TAG" --verify-tag --title "DroidRunner $TAG" --generate-notes \
            "droidrunner-$TAG.apk" \
            "runtime/out/droidrunner-$TAG-source.tar.gz"
