name: Device NPU probe

on:
  push:
    branches:
      - feature/npu-device-agent
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npu:
    runs-on: [self-hosted, android, android-npu]
    steps:
      - name: Device Agent capabilities
        run: |
          curl -fsS -H "Authorization: Bearer $DROIDRUNNER_DEVICE_TOKEN" \
            "$DROIDRUNNER_DEVICE_URL/v1/capabilities" | tee capabilities.json
          echo
      - name: NNAPI devices
        run: |
          grep -o '"name":"[^"]*"' capabilities.json | sort -u
      - name: NNAPI ADD benchmark (default device)
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $DROIDRUNNER_DEVICE_TOKEN" \
            -d '{"iterations":200}' \
            "$DROIDRUNNER_DEVICE_URL/v1/tests/nnapi"
          echo
      - name: NNAPI ADD benchmark per device
        run: |
          for dev in $(grep -o '"name":"[^"]*"' capabilities.json | cut -d'"' -f4 | sort -u); do
            echo "=== $dev ==="
            curl -fsS -X POST -H "Authorization: Bearer $DROIDRUNNER_DEVICE_TOKEN" \
              -d "{\"iterations\":200,\"device\":\"$dev\"}" \
              "$DROIDRUNNER_DEVICE_URL/v1/tests/nnapi" || true
            echo
          done
