name: Device model benchmark

# Runs a caller-supplied model on the device, which is the question a hardware
# pool exists to answer: how does *this* model behave on *this* silicon.
on:
  workflow_dispatch:
    inputs:
      label:
        description: "Extra runner label selecting the device (e.g. npu-neuron)"
        required: true
        default: "android-npu"

permissions: {}

jobs:
  model:
    runs-on: [self-hosted, android, "${{ inputs.label }}"]
    steps:
      # The composite action lives in this repository, so it has to be here.
      - uses: actions/checkout@v4

      # Two builds of the same network. Vendor accelerators are built for
      # quantized graphs — the MediaTek DSP and MDLA reject float32 outright —
      # so running both is what shows whether the silicon is reachable.
      - name: Fetch EfficientNet-Lite0, int8 and float32
        run: |
          base=https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0
          curl -fsSL -o int8.tflite "$base/int8/1/efficientnet_lite0.tflite"
          curl -fsSL -o float32.tflite "$base/float32/1/efficientnet_lite0.tflite"
          ls -l int8.tflite float32.tflite

      - name: Drivers this device exposes
        run: droidrunner-device devices

      - name: int8 on each driver
        run: |
          for dev in $(droidrunner-device devices); do
            echo "=== int8 on $dev ==="
            droidrunner-device test model int8.tflite --device "$dev" --iterations 30 || true
          done

      - name: float32 on each driver
        run: |
          for dev in $(droidrunner-device devices); do
            echo "=== float32 on $dev ==="
            droidrunner-device test model float32.tflite --device "$dev" --iterations 20 || true
          done

      # NNAPI cannot reach a Hexagon: Qualcomm ships no NNAPI driver, so these
      # phones enumerate only nnapi-reference above. qnn-htp is a different
      # route entirely, through Qualcomm's own runtime in an isolated process.
      # No "|| true" — a Snapdragon that cannot run this should fail loudly,
      # and the agent refuses rather than falling back to the CPU.
      - name: Hexagon HTP, on devices that have Qualcomm's runtime
        run: |
          if droidrunner-device capabilities | grep -q '"version": *[0-9]'; then
            echo "=== int8 on qnn-htp ==="
            droidrunner-device test model int8.tflite --device qnn-htp --iterations 30
            echo "=== float32 on qnn-htp ==="
            droidrunner-device test model float32.tflite --device qnn-htp --iterations 20
          else
            echo "no Hexagon on this device; skipping"
          fi

      # The point of caller-supplied inputs (#92): the same bytes through two
      # different processors, and a comparison of what came back. Latency says
      # the graph was accepted; this says whether it was computed the same way.
      - name: Same input, CPU and accelerator, compared
        run: |
          head -c 150528 /dev/urandom > input.bin
          mkdir -p out-cpu out-npu
          token="$(cat "$DROIDRUNNER_DEVICE_TOKEN_FILE")"
          ask() {
            curl -fsS -X POST -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' -d "$1" \
              "$DROIDRUNNER_DEVICE_URL/v1/tests/model"
            echo
          }
          run_on() { # run_on <device> <outdir>
            ask "{\"path\":\"$PWD/int8.tflite\",\"device\":\"$1\",\"iterations\":1,\"inputs\":[\"$PWD/input.bin\"],\"outputDir\":\"$PWD/$2\"}"
          }

          run_on nnapi-reference out-cpu
          if droidrunner-device capabilities | grep -q '"version": *[0-9]'; then
            run_on qnn-htp out-npu
          else
            echo "no Hexagon here; comparing the CPU against itself"
            run_on nnapi-reference out-npu
          fi

          # Top-1 over a 1000-class UINT8 softmax. Vendor accelerators quantize
          # and round differently, so the bytes are not expected to match; the
          # class the model chose is what a correctness check can hold them to.
          top1() { od -An -v -tu1 -w1 "$1" | nl -ba | sort -k2,2nr -k1,1n | head -1 | awk '{print $1-1" score="$2}'; }
          echo "cpu top-1: $(top1 out-cpu/output-0.bin)"
          echo "npu top-1: $(top1 out-npu/output-0.bin)"
          [ "$(top1 out-cpu/output-0.bin | cut -d' ' -f1)" = "$(top1 out-npu/output-0.bin | cut -d' ' -f1)" ] \
            || { echo "the two processors disagree on the class"; exit 1; }

      # #93: who ran the graph, and the CPU reference from the same request so
      # the ratio comes from one thermal state rather than two steps apart.
      # Straight at the agent rather than through the wrapper: the API is what
      # #93 changed, and the wrapper on the device can lag a fresh app build
      # (#107).
      - name: Who actually ran it, against its own baseline
        run: |
          token="$(cat "$DROIDRUNNER_DEVICE_TOKEN_FILE")"
          model="$PWD/int8.tflite"
          ask() {
            curl -fsS -X POST -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' -d "$1" \
              "$DROIDRUNNER_DEVICE_URL/v1/tests/model"
            echo
          }
          for dev in $(droidrunner-device devices); do
            echo "=== int8 on $dev ==="
            ask "{\"path\":\"$model\",\"device\":\"$dev\",\"iterations\":20,\"baseline\":true}"
          done
          if droidrunner-device capabilities | grep -q '"version": *[0-9]'; then
            echo "=== int8 on qnn-htp ==="
            ask "{\"path\":\"$model\",\"device\":\"qnn-htp\",\"iterations\":20}"
          fi

      # The contract from a consumer's seat: no wrapper, no HTTP, just inputs
      # and outputs (#95).
      - name: Through the composite action, as another repository would
        uses: ./actions/run-model
        id: device
        with:
          model: int8.tflite
          iterations: "20"
          results-path: action-result.json

      - name: The action's outputs are usable without parsing anything
        run: |
          echo "executed=${{ steps.device.outputs.executed }}"
          echo "by=${{ steps.device.outputs.executed-by }}"
          echo "median=${{ steps.device.outputs.median-us }}us"
          test -s "${{ steps.device.outputs.results-path }}"
          grep -q '"schema":1' "${{ steps.device.outputs.results-path }}"

      # #94: the shape a compiler's sweep has — many models, one request, and
      # a rejection recorded rather than aborting the rest.
      - name: A sweep in one request
        run: |
          token="$(cat "$DROIDRUNNER_DEVICE_TOKEN_FILE")"
          cat > manifest.json <<JSON
          [{"id":"int8-timed","path":"$PWD/int8.tflite","iterations":5},
           {"id":"int8-accepted-only","path":"$PWD/int8.tflite","iterations":0},
           {"id":"float32-accepted-only","path":"$PWD/float32.tflite","iterations":0},
           {"id":"missing","path":"$PWD/not-here.tflite"},
           {"id":"no-path"}]
          JSON
          droidrunner-device test batch manifest.json --output sweep.json
          echo "--- ids, in order:"
          grep -o '"id":"[^"]*"' sweep.json
          echo "--- one row per entry:"
          # grep -c counts lines, and this is one line of JSON.
          test "$(grep -o '"id":"' sweep.json | wc -l)" = 5
          echo "--- a rejection did not end the sweep:"
          grep -q '"id":"missing"' sweep.json && grep -q '"id":"no-path"' sweep.json
          echo "--- iterations 0 reports acceptance without timings:"
          grep -q '"iterations":0' sweep.json

      # #98: the conditions a number was measured under. Straight at the agent,
      # because the wrapper on the device ships with the runtime bundle and
      # lags a fresh app build (#107) — `--timings` is not in the published one.
      - name: What the phone was doing while it was measured
        run: |
          token="$(cat "$DROIDRUNNER_DEVICE_TOKEN_FILE")"
          curl -fsS -X POST -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "{\"path\":\"$PWD/int8.tflite\",\"iterations\":20,\"timings\":true}" \
            "$DROIDRUNNER_DEVICE_URL/v1/tests/model" > conditions.json
          echo "--- the tail, which is where a throttle shows:"
          grep -o '"p90Us":[^,}]*' conditions.json
          grep -o '"p99Us":[^,}]*' conditions.json
          echo "--- conditions at each end of the loop:"
          grep -o '"conditions":{[^}]*}[^}]*}[^}]*}' conditions.json
          echo "--- assertions:"
          grep -q '"p90Us"' conditions.json && grep -q '"p99Us"' conditions.json
          grep -q '"thermalStatus"' conditions.json
          # Both ends, and a verdict a gate can branch on without parsing them.
          grep -q '"before"' conditions.json && grep -q '"after"' conditions.json
          grep -q '"stable"' conditions.json
          # Every iteration, in the order it ran. 20 asked for, 20 back.
          test "$(grep -o '"timingsUs":\[[^]]*\]' conditions.json | tr ',' '\n' | wc -l)" = 20
          echo "--- and off by default, since 500 iterations is 500 numbers:"
          curl -fsS -X POST -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d "{\"path\":\"$PWD/int8.tflite\",\"iterations\":5}" \
            "$DROIDRUNNER_DEVICE_URL/v1/tests/model" > quiet.json
          grep -q '"timingsUs"' quiet.json && { echo "raw timings arrived unasked"; exit 1; }
          grep -q '"conditions"' quiet.json

      # #128: the delegate's own words, so a caller can check our reading of
      # them rather than take it. Printed here because a fixture taken from a
      # phone is the only kind that proves the parser reads what is actually
      # printed — one written by hand only proves it reads itself.
      - name: What the delegate actually printed
        run: |
          droidrunner-device test model int8.tflite --device "$(droidrunner-device devices | head -1)" \
            --iterations 1 --delegate-log --output delegate-log.json
          # Printed whole rather than unpicked: the guest has neither python3
          # nor jq, and a JSON string full of escaped newlines is not something
          # to take apart with sed. It is capped at 4000 characters at source.
          echo "<<<BEGIN-DELEGATE-RESULT"
          cat delegate-log.json
          echo
          echo "END-DELEGATE-RESULT>>>"

      # A file no interpreter can build says so, rather than arriving as a bare
      # `failed` that a sweep would record and carry on from. Reported by the
      # first consumer outside this project.
      - name: A model nothing can load is named as the caller's fault
        run: |
          head -c 4096 /dev/urandom > broken.tflite
          printf 'TFL3' | dd of=broken.tflite bs=1 seek=4 conv=notrunc status=none
          status=0
          droidrunner-device test model broken.tflite --iterations 1 \
            --output broken.json > /dev/null || status=$?
          cat broken.json
          grep -q '"code": *"invalid-model"' broken.json
          test "$status" = 1
          echo "reported invalid-model, exit $status"

      # An input that does not fit the model is the caller's mistake, and says
      # so rather than arriving as a bare `failed`. Reported by the first
      # consumer outside this project, whose fixtures were 1024 elements for a
      # model declaring 1.
      - name: An input of the wrong size is named as the caller's fault
        run: |
          head -c 64 /dev/urandom > wrong-size.bin
          status=0
          droidrunner-device test model int8.tflite --iterations 1 \
            --input wrong-size.bin --output mismatch.json > /dev/null || status=$?
          cat mismatch.json
          grep -q '"code": *"invalid-request"' mismatch.json
          # The message has to name what it wanted and what it got.
          grep -q 'needs 150528 bytes' mismatch.json
          test "$status" = 1
          echo "reported invalid-request, exit $status"

      # Does the accelerator compute what it was asked to, or only run it?
      # Nothing here has ever checked: the NPU verification counts delegated
      # nodes, and the differential test compares a top-1 class on an int8
      # network where there is no ULP to be off by. Prompted by NxPU finding
      # 1024 of 1024 f32 ADD results high by exactly one ULP on a Hexagon V73.
      - name: What the accelerator computed, not just who computed it
        run: |
          mkdir -p out-cpu-f32 out-dev-f32
          # The CPU runs the same fixtures as a control: a reference the CPU
          # disagrees with says nothing about any accelerator.
          droidrunner-device test model tools/ulp/fixtures/add-f32.tflite \
            --input tools/ulp/fixtures/input-0.bin \
            --input tools/ulp/fixtures/input-1.bin \
            --output-dir out-cpu-f32 --iterations 1 > /dev/null
          if droidrunner-device capabilities | grep -q '"version": *[0-9]'; then
            droidrunner-device test model tools/ulp/fixtures/add-f32.tflite \
              --device qnn-htp \
              --input tools/ulp/fixtures/input-0.bin \
              --input tools/ulp/fixtures/input-1.bin \
              --output-dir out-dev-f32 --iterations 1 --output f32-device.json > /dev/null
            grep -o '"executedBy":"[^"]*"' f32-device.json || true
          else
            # Every other vendor reaches its accelerator through NNAPI, and the
            # question is the same one: does it compute what it was asked to?
            driver="$(droidrunner-device devices | grep -v nnapi-reference | head -1)"
            if [ -n "$driver" ]; then
              droidrunner-device test model tools/ulp/fixtures/add-f32.tflite \
                --device "$driver" \
                --input tools/ulp/fixtures/input-0.bin \
                --input tools/ulp/fixtures/input-1.bin \
                --output-dir out-dev-f32 --iterations 1 --output f32-device.json > /dev/null || true
              grep -o '"executedBy":"[^"]*"' f32-device.json || true
            else
              echo "no accelerator on this phone; CPU only"
            fi
          fi
          # The same question with results on both sides of zero. Floats are
          # sign-and-magnitude, so "+1 to the raw word" and "+1 step toward
          # positive" agree on positives and disagree on negatives — one run
          # tells them apart. Suggested by NxPU.
          mkdir -p out-cpu-signed out-dev-signed out-cpu-odd out-dev-odd \
                   out-cpu-res out-dev-res
          droidrunner-device test model tools/ulp/fixtures/add-f32.tflite \
            --input tools/ulp/fixtures/signed-input-0.bin \
            --input tools/ulp/fixtures/signed-input-1.bin \
            --output-dir out-cpu-signed --iterations 1 > /dev/null
          if [ -s f32-device.json ]; then
            driver="$(grep -o '"requestedDevice":"[^"]*"' f32-device.json | cut -d'"' -f4)"
            droidrunner-device test model tools/ulp/fixtures/add-f32.tflite \
              --device "$driver" \
              --input tools/ulp/fixtures/signed-input-0.bin \
              --input tools/ulp/fixtures/signed-input-1.bin \
              --output-dir out-dev-signed --iterations 1 > /dev/null || true
          fi
          # And the set whose sums already have an odd low mantissa bit: an
          # increment carries there, a forced bit does nothing, and everything
          # measured before was a multiple of 0.25 where the two agree.
          droidrunner-device test model tools/ulp/fixtures/add-f32.tflite \
            --input tools/ulp/fixtures/odd-input-0.bin \
            --input tools/ulp/fixtures/odd-input-1.bin \
            --output-dir out-cpu-odd --iterations 1 > /dev/null
          if [ -s f32-device.json ]; then
            driver="$(grep -o '"requestedDevice":"[^"]*"' f32-device.json | cut -d'"' -f4)"
            droidrunner-device test model tools/ulp/fixtures/add-f32.tflite \
              --device "$driver" \
              --input tools/ulp/fixtures/odd-input-0.bin \
              --input tools/ulp/fixtures/odd-input-1.bin \
              --output-dir out-dev-odd --iterations 1 > /dev/null || true
          fi
          # And the sweep that asks where it stops resolving a difference at
          # all, rather than assuming a rule about bits: 1.0 + 2^-k for k from
          # 1 to 23. The coarse sets could not have answered this.
          droidrunner-device test model tools/ulp/fixtures/add-f32.tflite \
            --input tools/ulp/fixtures/resolution-input-0.bin \
            --input tools/ulp/fixtures/resolution-input-1.bin \
            --output-dir out-cpu-res --iterations 1 > /dev/null
          if [ -s f32-device.json ]; then
            driver="$(grep -o '"requestedDevice":"[^"]*"' f32-device.json | cut -d'"' -f4)"
            droidrunner-device test model tools/ulp/fixtures/add-f32.tflite \
              --device "$driver" \
              --input tools/ulp/fixtures/resolution-input-0.bin \
              --input tools/ulp/fixtures/resolution-input-1.bin \
              --output-dir out-dev-res --iterations 1 > /dev/null || true
          fi
          # Compared off-device: the guest has no python, and ULP arithmetic in
          # awk is not something to trust a finding to.
          ls -l out-cpu-f32 out-dev-f32 out-cpu-signed out-dev-signed || true

      - uses: actions/upload-artifact@v4
        with:
          name: f32-outputs
          path: |
            out-cpu-f32/
            out-dev-f32/
            out-cpu-signed/
            out-dev-signed/
            out-cpu-odd/
            out-dev-odd/
            out-cpu-res/
            out-dev-res/
            out-gpu-f32/
            f32-device.json
            qnn-gpu.json
          if-no-files-found: warn

      # #140: QnnBackend has accepted "gpu" since #82 and nobody has ever
      # asked for it. Adreno through QNN needs no new dependency — either it
      # already works and Qualcomm GPU coverage exists, or it does not and the
      # message says why. Not fatal: this step exists to find out.
      - name: The Adreno, through QNN, which has never been tried
        run: |
          if droidrunner-device capabilities | grep -q '"version": *[0-9]'; then
            status=0
            droidrunner-device test model int8.tflite --device qnn-gpu \
              --iterations 10 --output qnn-gpu.json > /dev/null || status=$?
            cat qnn-gpu.json
            echo "exit $status"
            grep -o '"executed":"[^"]*"\|"executedBy":"[^"]*"\|"code":"[^"]*"' qnn-gpu.json || true
            # And the same f32 fixtures, so the arithmetic question is asked of
            # the GPU too — the HTP answered it by computing in fp16.
            mkdir -p out-gpu-f32
            droidrunner-device test model tools/ulp/fixtures/add-f32.tflite \
              --device qnn-gpu \
              --input tools/ulp/fixtures/input-0.bin \
              --input tools/ulp/fixtures/input-1.bin \
              --output-dir out-gpu-f32 --iterations 1 > /dev/null || true
            ls -l out-gpu-f32 || true
          else
            echo "no Qualcomm runtime on this phone; skipping"
          fi

      # #128: `executed: unknown` means the delegate ran and we could not read
      # what it took — the failure mode of parsing prose. It is the honest
      # answer and an invisible one, so a device run says so out loud.
      - name: Nothing came back unattributable
        run: |
          for f in sweep.json action-result.json conditions.json quiet.json; do
            [ -s "$f" ] || continue
            if grep -q '"executed": *"unknown"' "$f"; then
              echo "$f contains a result the delegate would not attribute:"
              grep -o '"id":"[^"]*"[^}]*"executed": *"unknown"' "$f" | head -5
              exit 1
            fi
          done
          echo "every result named who executed it"

      - name: Whatever NNAPI picks for int8
        run: droidrunner-device test model int8.tflite --iterations 30
